<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 25px;
            max-width: 1200px;
            margin: 40px auto;
        }

        .tarjeta {
            background-color: white;
            width: 30%;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        .tarjeta img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .tarjeta h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .tarjeta p {
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Homestuck_logo.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original" alt="Título de mi página" class="titulo-imagen" style="display: block; margin: auto;">>
	 



    <div class="galeria">

        <div class="tarjeta">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWjwzVAQx8TTlOj7j8CMneqiNk8BbWKkxhj8zF-DY3KQ&s=10" alt="Descripción de la foto 1">
            <h2>Jhon Egbert</h2>
            <p>Protagonista lol.</p>
        </div>


        <div class="tarjeta">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQA878I3LHjugY3d1jsci_g85ik6p-7he2zriL0YUqNnQ&s=10" alt="Descripción de la foto 2">
            <h2>Nepeta</h2>
            <p>Gato squizo.</p>
        </div>

        <div class="tarjeta">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnzyKloPaithtZRPPnA7nEheFBT3uMxZaXZbc655MI4A&s=10" alt="Descripción de la foto 3">
            <h2>Karkat</h2>
            <p>troll quisquilloso.</p>
        </div>

    </div>

</body>
</html>
